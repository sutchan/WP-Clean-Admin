<!DOCTYPE html>
<!--
  WP Clean Admin 高保真后台原型
  设计语言见 设计规范_20260808.md
  布局：左侧功能导航 + 右侧内容区（WP 后台惯用）
  响应式断点：782px / 600px
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WP Clean Admin · 高保真原型</title>
    <link rel="stylesheet" href="wpca-components.css" />
</head>
<body class="wp-admin wp-core-ui">
    <div class="wrap wpca-app">
        <h1 class="wpca-app__title">WP Clean Admin</h1>

        <!--
          nonce 隐藏字段：name 固定为 _wpnonce（与 AJAX 网关一致）。
          真实环境由 wp_nonce_field('wpca_ajax_nonce', '_wpnonce') 注入；
          以下为浏览器直接预览时的占位回退（USE_MOCK=true 时不参与校验）。
        -->
        <input type="hidden" name="_wpnonce" value="MOCK_NONCE" />

        <div class="wpca-layout">
            <!-- 左侧导航 -->
            <nav class="wpca-nav" aria-label="功能导航">
                <button class="wpca-nav__item is-active" data-tab="dashboard">仪表盘</button>
                <button class="wpca-nav__item" data-tab="cleanup">清理</button>
                <button class="wpca-nav__item" data-tab="performance">性能</button>
                <button class="wpca-nav__item" data-tab="security">安全与菜单</button>
                <button class="wpca-nav__item" data-tab="database">数据库</button>
                <button class="wpca-nav__item" data-tab="diagnostics">诊断</button>
                <button class="wpca-nav__item" data-tab="settings">设置</button>
            </nav>

            <!-- 右侧内容 -->
            <main class="wpca-content" id="wpca-content">

                <!-- 仪表盘 -->
                <section class="wpca-panel is-active" data-panel="dashboard">
                    <div class="wpca-panel__head">
                        <h2>站点体检</h2>
                        <button class="button button-primary wpca-btn" id="wpca-scan-btn">一键体检</button>
                    </div>
                    <div class="wpca-stats" id="wpca-stats">
                        <p class="wpca-empty">点击「一键体检」查看可优化项</p>
                    </div>
                    <div class="wpca-progress" id="wpca-scan-progress" hidden>
                        <div class="wpca-progress__bar"></div>
                    </div>
                </section>

                <!-- 清理 -->
                <section class="wpca-panel" data-panel="cleanup" hidden>
                    <div class="wpca-panel__head"><h2>清理任务</h2></div>
                    <table class="wpca-table" id="wpca-cleanup-table">
                        <thead><tr><th>任务</th><th>数量</th><th>风险</th><th>操作</th></tr></thead>
                        <tbody><!-- JS 渲染 --></tbody>
                    </table>
                </section>

                <!-- 性能 -->
                <section class="wpca-panel" data-panel="performance" hidden>
                    <div class="wpca-panel__head"><h2>性能优化</h2></div>
                    <div class="wpca-list" id="wpca-perf-list"><!-- JS 渲染 --></div>
                </section>

                <!-- 安全与菜单 -->
                <section class="wpca-panel" data-panel="security" hidden>
                    <div class="wpca-panel__head"><h2>后台菜单可见性</h2></div>
                    <table class="wpca-table" id="wpca-menu-table">
                        <thead><tr><th>菜单</th><th>类型</th><th>可见</th></tr></thead>
                        <tbody><!-- JS 渲染 --></tbody>
                    </table>
                    <p class="wpca-actions">
                        <button class="button button-primary wpca-btn" id="wpca-menu-save">保存菜单设置</button>
                    </p>
                </section>

                <!-- 数据库 -->
                <section class="wpca-panel" data-panel="database" hidden>
                    <div class="wpca-panel__head">
                        <h2>数据表</h2>
                        <span>
                            <button class="button wpca-btn" id="wpca-db-backup">备份</button>
                            <button class="button wpca-btn" id="wpca-db-optimize">优化</button>
                        </span>
                    </div>
                    <table class="wpca-table" id="wpca-db-table">
                        <thead><tr><th>表名</th><th>行数</th><th>大小</th><th>碎片</th></tr></thead>
                        <tbody><!-- JS 渲染 --></tbody>
                    </table>
                </section>

                <!-- 诊断 -->
                <section class="wpca-panel" data-panel="diagnostics" hidden>
                    <div class="wpca-panel__head">
                        <h2>环境诊断</h2>
                        <button class="button button-primary wpca-btn" id="wpca-diag-btn">运行诊断</button>
                    </div>
                    <table class="wpca-table" id="wpca-diag-table">
                        <thead><tr><th>项目</th><th>当前值</th><th>状态</th><th>建议</th></tr></thead>
                        <tbody><!-- JS 渲染 --></tbody>
                    </table>
                </section>

                <!-- 设置 -->
                <section class="wpca-panel" data-panel="settings" hidden>
                    <div class="wpca-panel__head"><h2>全局设置</h2></div>

                    <fieldset class="wpca-fieldset">
                        <legend>常规</legend>
                        <label class="wpca-field">
                            <span class="wpca-field__label">保留修订版本数</span>
                            <input type="number" name="general[keep_revisions]" value="10" min="0" class="wpca-field__input" />
                        </label>
                        <label class="wpca-field">
                            <span class="wpca-field__label">自动清理</span>
                            <label class="wpca-switch"><input type="checkbox" name="general[auto_cleanup]" checked /><span class="wpca-switch__slider"></span></label>
                        </label>
                    </fieldset>

                    <fieldset class="wpca-fieldset">
                        <legend>性能</legend>
                        <label class="wpca-field">
                            <span class="wpca-field__label">禁用 Emoji</span>
                            <label class="wpca-switch"><input type="checkbox" name="performance[disable_emojis]" checked /><span class="wpca-switch__slider"></span></label>
                        </label>
                        <label class="wpca-field">
                            <span class="wpca-field__label">图片懒加载</span>
                            <label class="wpca-switch"><input type="checkbox" name="performance[lazy_images]" checked /><span class="wpca-switch__slider"></span></label>
                        </label>
                        <label class="wpca-field">
                            <span class="wpca-field__label">压缩 HTML</span>
                            <label class="wpca-switch"><input type="checkbox" name="performance[minify_html]" /><span class="wpca-switch__slider"></span></label>
                        </label>
                    </fieldset>

                    <p class="wpca-actions">
                        <button class="button button-primary wpca-btn" id="wpca-settings-save">保存设置</button>
                    </p>
                </section>

            </main>
        </div>
    </div>

    <!-- 确认弹窗（危险操作） -->
    <div class="wpca-modal" id="wpca-modal" role="dialog" aria-modal="true" hidden>
        <div class="wpca-modal__backdrop" data-close></div>
        <div class="wpca-modal__box">
            <h3 class="wpca-modal__title">确认操作</h3>
            <p class="wpca-modal__body" id="wpca-modal-body"></p>
            <p class="wpca-modal__actions">
                <button class="button wpca-btn" data-close>取消</button>
                <button class="button button-primary wpca-btn wpca-btn--danger" id="wpca-modal-confirm">确认</button>
            </p>
        </div>
    </div>

    <!-- 轻提示容器 -->
    <div class="wpca-toast-area" id="wpca-toast-area" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
